plugins {
    id 'application'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'seoultech.se.tetris.main.Tetris'
}

configurations {
    jacocoRuntimeAgent
}

jacoco {
    toolVersion = '0.8.15'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    jacocoRuntimeAgent 'org.jacoco:org.jacoco.agent:0.8.15:runtime'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-Xlint:all')
}

def legacyCoverageFile = layout.buildDirectory.file('jacoco/legacy-regression.exec')

tasks.named('test', Test) {
    useJUnitPlatform()
    failOnNoDiscoveredTests = true
    systemProperty 'java.awt.headless', 'true'
    // Gradle workers' java.class.path does not contain the full test runtime.
    systemProperty 'tetris.regression.classpath', sourceSets.test.runtimeClasspath.asPath
    outputs.file(legacyCoverageFile)
    doFirst {
        delete legacyCoverageFile
        systemProperty 'tetris.jacoco.agent', configurations.jacocoRuntimeAgent.singleFile.absolutePath
        systemProperty 'tetris.jacoco.destination',
            legacyCoverageFile.get().asFile.absolutePath
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    executionData legacyCoverageFile
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('test')
    executionData legacyCoverageFile
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

tasks.register('legacyRegressionCoverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Checks that isolated regression JVMs recorded executed product lines.'
    dependsOn tasks.named('test')
    executionData legacyCoverageFile
    sourceSets project.sourceSets.main
    // Missing execution data must fail instead of JaCoCo's default task skip.
    setOnlyIf { true }
    doFirst {
        if (!legacyCoverageFile.get().asFile.isFile()) {
            throw new GradleException('Missing isolated regression coverage data.')
        }
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDCOUNT'
                minimum = 1
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
    dependsOn tasks.named('jacocoTestCoverageVerification')
    dependsOn tasks.named('legacyRegressionCoverageVerification')
}

apply from: 'gradle/packaging.gradle'


tasks.register('desktopSmoke', JavaExec) {
    group = 'verification'
    description = 'Runs a real JFrame lifecycle smoke check with synthetic listener input.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'seoultech.se.tetris.component.DesktopSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    systemProperty 'java.awt.headless', 'false'
}

tasks.register('desktopFocusSmoke', JavaExec) {
    group = 'verification'
    description = 'Checks input focus across screens in an active desktop session with Robot or synthetic Swing events.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'seoultech.se.tetris.component.DesktopFocusSmoke'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    systemProperty 'java.awt.headless', 'false'
}
